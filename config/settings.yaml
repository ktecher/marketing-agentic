# Global settings. ${VAR:-default} reads an environment variable (from .env), else the default.

# true = web_search / read_page answer from data/mock/ (fictional brand world, no network).
# The LLM still runs. Toggle per run with MOCK_MODE=true or the UI switch.
mock_mode: ${MOCK_MODE:-false}

# Default LLM for every agent. Override per agent in agents.yaml.
llm:
  provider: ${LLM_PROVIDER:-claude_code}   # claude_code | anthropic | openai | ollama | openai_compatible
  model: ${LLM_MODEL:-sonnet}
  base_url: ${LLM_BASE_URL:-}              # openai_compatible / ollama only
  # temperature: 0.3                       # ignored by claude_code

# Tool providers. Free default first; paid swaps listed beside each.
tools:
  web_search:
    provider: ${SEARCH_PROVIDER:-ddgs}     # ddgs (free, no key) | tavily (TAVILY_API_KEY) | brave (BRAVE_API_KEY)
    max_results: 6
    # ddgs only: which engines it scrapes. Measured 2026-10-05 from this network: for web
    # searches DuckDuckGo, Brave, Google and Mojeek refused every query, Bing and Yahoo answered
    # every one; "auto" kept picking the refusing ones. News worked on most engines.
    web_engines: ${SEARCH_WEB_ENGINES:-bing,yahoo}
    news_engines: ${SEARCH_NEWS_ENGINES:-auto}
  read_page:
    provider: ${READER_PROVIDER:-scrapling}  # scrapling (free; stealth browser for blocked/JS pages) | trafilatura (free, plain HTTP) | jina (free tier) | firecrawl (FIRECRAWL_API_KEY)
    browser: ${READER_BROWSER:-true}   # scrapling only: allow the stealth-browser fallback (needs `uv run scrapling install`)
    max_chars: 8000
  current_date: {}
